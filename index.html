<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风险点告知卡智能生成系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/xlsx-populate@1.21.0/browser/xlsx-populate.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { 
            text-align: center; 
            color: #fff; 
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .header h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .header p { font-size: 14px; color: rgba(255,255,255,0.7); }
        
        .main-content { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
        
        .control-panel {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            position: sticky;
            top: 20px;
            height: fit-content;
        }
        
        .card-preview {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #2c3e50;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafbfc;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.4);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .logo-upload {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafbfc;
        }
        .logo-upload:hover { border-color: #2563eb; background: rgba(37,99,235,0.05); }
        .logo-upload input { display: none; }
        .logo-upload i { font-size: 32px; color: #94a3b8; margin-bottom: 8px; }
        
        .size-selector {
            display: flex;
            gap: 10px;
        }
        .size-option {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e6ed;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .size-option:hover { border-color: #2563eb; }
        .size-option.active { 
            border-color: #2563eb; 
            background: rgba(37,99,235,0.1);
            color: #2563eb;
        }
        
        .card-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .risk-card {
            background: linear-gradient(180deg, #1e3a5f 0%, #0d2137 100%);
            color: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
        }
        
        .logo-area {
            width: 80px;
            height: 60px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
        
        .logo-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .card-title {
            flex: 1;
            text-align: center;
            margin-right: 80px;
        }
        
        .card-title h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        
        .card-title p {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }
        
        .safety-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .icon-item {
            text-align: center;
            width: 80px;
        }
        
        .icon-box {
            width: 70px;
            height: 70px;
            background: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            padding: 8px;
        }
        
        .icon-box svg { width: 100%; height: 100%; }
        
        .icon-label {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            word-break: break-all;
        }
        
        .section {
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 8px;
            padding-left: 12px;
            border-left: 3px solid #60a5fa;
        }
        
        .section-content {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
        }
        
        .four-dimensions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .dimension-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            border-top: 3px solid;
        }
        
        .dimension-card:nth-child(1) { border-top-color: #f59e0b; }
        .dimension-card:nth-child(2) { border-top-color: #10b981; }
        .dimension-card:nth-child(3) { border-top-color: #8b5cf6; }
        .dimension-card:nth-child(4) { border-top-color: #ef4444; }
        
        .dimension-title {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            margin-bottom: 6px;
        }
        
        .dimension-content {
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.9);
        }
        
        .card-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid rgba(255,255,255,0.15);
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.6);
        }
        
        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #2563eb;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tooltip {
            position: relative;
            display: inline-block;
        }
        
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
        }
        
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛠️ 风险点告知卡智能生成系统</h1>
            <p>AI驱动的专业EHS风险评估工具 · 一键生成合规风险告知卡</p>
        </div>
        
        <div class="main-content">
            <div class="control-panel">
                <div class="form-group">
                    <label>岗位名称 <span style="color:#ef4444;">*</span></label>
                    <input type="text" id="jobName" placeholder="如：有限空间作业、高处作业、动火作业..." value="有限空间作业">
                </div>
                
                <div class="form-group">
                    <label>企业Logo（可选）</label>
                    <div class="logo-upload" id="logoUpload">
                        <input type="file" id="logoFile" accept="image/*">
                        <i>🖼️</i>
                        <div>点击上传Logo</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>导出尺寸</label>
                    <div class="size-selector">
                        <div class="size-option active" data-size="A4">A4</div>
                        <div class="size-option" data-size="A3">A3</div>
                        <div class="size-option" data-size="A2">A2</div>
                    </div>
                </div>
                
                <button class="btn btn-primary" id="generateBtn">
                    🤖 AI智能评估生成
                </button>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" id="exportPngBtn">
                        📷 导出PNG
                    </button>
                    <button class="btn btn-secondary" id="exportPptBtn">
                        📊 导出PPTX
                    </button>
                </div>
                
                <div class="form-group" style="margin-top:24px;border-top:1px solid #e0e6ed;padding-top:20px;">
                    <label>手动编辑内容（如需调整）</label>
                    <textarea id="manualContent" placeholder="在此输入自定义的风险评估内容，系统将按四维措施自动拆分..."></textarea>
                </div>
            </div>
            
            <div class="card-preview">
                <div class="card-container" id="cardContainer">
                    <div class="risk-card" id="riskCard">
                        <div class="card-header">
                            <div class="logo-area" id="logoArea">企业Logo</div>
                            <div class="card-title">
                                <h2>风险点告知卡</h2>
                                <p>RISK INFORM CARD</p>
                            </div>
                        </div>
                        
                        <div class="safety-icons" id="safetyIcons">
                            <div class="icon-item">
                                <div class="icon-box"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#fff"/><path d="M50 15L50 50L75 75" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                                <div class="icon-label">警告标志</div>
                            </div>
                            <div class="icon-item">
                                <div class="icon-box"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#ef4444"/><path d="M35 35L65 65M65 35L35 65" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg></div>
                                <div class="icon-label">禁止标志</div>
                            </div>
                            <div class="icon-item">
                                <div class="icon-box"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#10b981"/><path d="M35 50L45 60L70 35" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                                <div class="icon-label">指令标志</div>
                            </div>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">⚠️ 风险描述</div>
                            <div class="section-content" id="riskDescription">
                                请点击"AI智能评估生成"按钮，系统将自动生成专业的风险评估内容。
                            </div>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">🎯 风险等级</div>
                            <div class="section-content" id="riskLevel">
                                待评估
                            </div>
                        </div>
                        
                        <div class="four-dimensions">
                            <div class="dimension-card">
                                <div class="dimension-title">🏗️ 工程措施</div>
                                <div class="dimension-content" id="engineering">
                                    待生成
                                </div>
                            </div>
                            <div class="dimension-card">
                                <div class="dimension-title">📋 管理措施</div>
                                <div class="dimension-content" id="management">
                                    待生成
                                </div>
                            </div>
                            <div class="dimension-card">
                                <div class="dimension-title">📚 培训教育</div>
                                <div class="dimension-content" id="training">
                                    待生成
                                </div>
                            </div>
                            <div class="dimension-card">
                                <div class="dimension-title">🛡️ 个人防护</div>
                                <div class="dimension-content" id="ppe">
                                    待生成
                                </div>
                            </div>
                        </div>
                        
                        <div class="card-footer">
                            <span>编制单位：___________</span>
                            <span>编制日期：___________</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        function getSignForJob(jobName) {
            const keywords = {
                '有限空间': { warning: 5, forbidden: 2, instruction: 4 },
                '高处': { warning: 4, forbidden: 2, instruction: 6 },
                '动火': { warning: 2, forbidden: 0, instruction: 5 },
                '焊接': { warning: 2, forbidden: 0, instruction: 2 },
                '用电': { warning: 1, forbidden: 4, instruction: 2 },
                '吊装': { warning: 0, forbidden: 2, instruction: 1 },
                '冲压': { warning: 6, forbidden: 3, instruction: 2 },
                '喷漆': { warning: 2, forbidden: 1, instruction: 4 },
                '高温': { warning: 7, forbidden: 2, instruction: 5 },
                '腐蚀': { warning: 9, forbidden: 2, instruction: 3 },
                '机械': { warning: 6, forbidden: 3, instruction: 1 }
            };
            
            for (const [keyword, indices] of Object.entries(keywords)) {
                if (jobName.includes(keyword)) {
                    return indices;
                }
            }
            return { warning: 0, forbidden: 0, instruction: 0 };
        }

        function generateMockAIResponse(jobName) {
            if (riskTemplates[jobName]) {
                return riskTemplates[jobName];
            }
            
            const keywords = jobName.includes('高处') ? '高处' : 
                           jobName.includes('动火') ? '动火' :
                           jobName.includes('焊接') ? '焊接' :
                           jobName.includes('有限空间') ? '有限空间' : '通用';
            
            return {
                description: `${jobName}作业存在多种安全风险，包括机械伤害、坠落、触电等潜在危险，需采取综合防控措施。`,
                level: keywords === '有限空间' || keywords === '动火' ? '重大风险（红色）' : '较大风险（橙色）',
                engineering: `1. 安装安全防护设施\n2. 设置警示标识\n3. 配备监测设备\n4. 实施隔离措施`,
                management: `1. 执行作业许可制度\n2. 指定专职监护人员\n3. 定期安全检查\n4. 应急预案演练`,
                training: `1. ${jobName}安全操作培训\n2. 应急救援知识培训\n3. 设备使用培训\n4. 防护装备培训`,
                ppe: `1. 安全帽\n2. 防护手套\n3. 防护眼镜\n4. 防护服`,
                signs: getSignForJob(jobName)
            };
        }

        function updateCardContent(data) {
            document.getElementById('riskDescription').textContent = data.description;
            document.getElementById('riskLevel').textContent = data.level;
            document.getElementById('engineering').textContent = data.engineering;
            document.getElementById('management').textContent = data.management;
            document.getElementById('training').textContent = data.training;
            document.getElementById('ppe').textContent = data.ppe;
            
            const signIndices = data.signs || getSignForJob(document.getElementById('jobName').value);
            const iconsContainer = document.getElementById('safetyIcons');
            
            const warningSign = safetySigns.warning[signIndices.warning];
            const forbiddenSign = safetySigns.forbidden[signIndices.forbidden];
            const instructionSign = safetySigns.instruction[signIndices.instruction];
            
            iconsContainer.innerHTML = `
                <div class="icon-item">
                    <div class="icon-box">${warningSign.svg}</div>
                    <div class="icon-label">${warningSign.name}</div>
                </div>
                <div class="icon-item">
                    <div class="icon-box">${forbiddenSign.svg}</div>
                    <div class="icon-label">${forbiddenSign.name}</div>
                </div>
                <div class="icon-item">
                    <div class="icon-box">${instructionSign.svg}</div>
                    <div class="icon-label">${instructionSign.name}</div>
                </div>
            `;
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const jobName = document.getElementById('jobName').value.trim();
            if (!jobName) {
                alert('请输入岗位名称');
                return;
            }
            
            const cardContainer = document.getElementById('cardContainer');
            cardContainer.innerHTML = '<div class="loading">AI正在分析评估中...</div>';
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            const aiResponse = generateMockAIResponse(jobName);
            cardContainer.innerHTML = document.getElementById('riskCard').outerHTML;
            
            updateCardContent(aiResponse);
        });

            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('logoArea').innerHTML = `<img src="${event.target.result}" alt="Logo">`;
                };
                reader.readAsDataURL(file);
            }
        });

            document.getElementById('logoFile').click();
        });

                document.querySelectorAll('.size-option').forEach(opt => opt.classList.remove('active'));

                const size = option.dataset.size;
                const scale = size === 'A2' ? 1.5 : size === 'A3' ? 1.25 : 1;
                document.getElementById('cardContainer').style.transform = `scale(${scale})`;
                document.getElementById('cardContainer').style.transformOrigin = 'top center';
            });
        });

            const canvas = await html2canvas(riskCard, {
                scale: scale,
                useCORS: true,
                backgroundColor: null
            });
            
            const link = document.createElement('a');
            link.download = `风险点告知卡_${document.getElementById('jobName').value}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

            const dim = dimensions[size];

                const workbook = await xlsxPopulate.fromBlankAsync();

                    .style({ fontSize: 12, fontColor: '#2563eb', fontWeight: 'bold' });

                sheet.range('E12').value('📋 管理措施')

                sheet.range('E13:H16').merge().value(document.getElementById('management').textContent)
                    .style({ fontSize: 10, fontColor: '#333', wrapText: true });
                
                sheet.range('A17').value('📚 培训教育')
                    .style({ fontSize: 12, fontColor: '#8b5cf6', fontWeight: 'bold' });
                sheet.range('A18:D21').merge().value(document.getElementById('training').textContent)
                    .style({ fontSize: 10, fontColor: '#333', wrapText: true });
                
                sheet.range('E17').value('🛡️ 个人防护')
                    .style({ fontSize: 12, fontColor: '#ef4444', fontWeight: 'bold' });
                sheet.range('E18:H21').merge().value(document.getElementById('ppe').textContent)
                    .style({ fontSize: 10, fontColor: '#333', wrapText: true });
                
                sheet.range('A22:H22').merge().value('编制单位：___________                          编制日期：___________')
                    .style({ fontSize: 10, fontColor: '#666', horizontalAlignment: 'center' });
                
                sheet.column('A').width(30);
                sheet.column('B').width(30);
                sheet.column('C').width(30);
                sheet.column('D').width(30);
                sheet.column('E').width(30);
                sheet.column('F').width(30);
                sheet.column('G').width(30);
                sheet.column('H').width(30);
                
                const base64 = await workbook.outputAsync('base64');
                const link = document.createElement('a');
                link.download = `风险点告知卡_${jobName}.xlsx`;
                link.href = `data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,${base64}`;
                link.click();
                
            } catch (error) {
                console.error('Export error:', error);
                alert('导出PPTX时出现错误，请重试');
            }
        });

        document.getElementById('manualContent').addEventListener('input', () => {
            const content = document.getElementById('manualContent').value;
            if (content.trim()) {
                const parts = content.split('---');
                if (parts.length >= 4) {
                    document.getElementById('engineering').textContent = parts[0].trim();
                    document.getElementById('management').textContent = parts[1].trim();
                    document.getElementById('training').textContent = parts[2].trim();
                    document.getElementById('ppe').textContent = parts[3].trim();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateCardContent(riskTemplates['有限空间作业']);
        });
